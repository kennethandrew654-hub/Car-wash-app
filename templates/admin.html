<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash Admin Revenue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f1f5f9; }
        .container { max-width: 800px; margin: auto; }
        .revenue-box { background: #0f172a; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .revenue-box h2 { margin: 0; font-size: 32px; color: #22c55e; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #1e293b; color: white; }
        .btn-complete { background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #fef08a; color: #854d0e; }
        .badge-completed { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="container">
        <div class="revenue-box">
            <p style="margin:0; font-size:14px; text-transform:uppercase; letter-spacing:1px; color:#94a3b8;">Total Completed Revenue</p>
            <h2>MK {{ "{:,}".format(total_revenue) }}</h2>
        </div>

        <h3>Recent Bookings</h3>
        <table>
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Car</th>
                    <th>Service</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for b in bookings %}
                <tr>
                    <td><strong>{{ b[1] }}</strong><br><small>{{ b[2] }}</small></td>
                    <td>{{ b[3] }}</td>
                    <td>{{ b[4] }}</td>
                    <td>MK {{ "{:,}".format(b[5]) }}</td>
                    <td>
                        <span class="badge {{ 'badge-completed' if b[6] == 'Completed' else 'badge-pending' }}">{{ b[6] }}</span>
                    </td>
                    <td>
                        <form method="POST" style="display:inline;">
                            <input type="hidden" name="id" value="{{ b[0] }}">
                            {% if b[6] == 'Pending' %}
                            <button type="submit" name="action" value="complete" class="btn-complete">Done</button>
                            {% endif %}
                            <button type="submit" name="action" value="delete" class="btn-delete">X</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
