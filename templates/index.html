<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Car Wash - Lilongwe</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #0f172a; color: #f8fafc; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; padding: 20px 0; border-bottom: 2px solid #1e293b; }
        .header h1 { margin: 0; color: #38bdf8; font-size: 26px; }
        .header p { color: #94a3b8; font-size: 14px; margin-top: 5px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; background: #22c55e; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #16a34a; }
        .pricing-list { margin-top: 25px; }
        .service-box { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .service-title { font-weight: bold; color: white; display: flex; justify-content: space-between; }
        .service-desc { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EXPRESS CAR WASH</h1>
            <p>Premium Vehicle Cleaning & Detailing Services</p>
        </div>

        <div class="card">
            <h3 style="margin-top:0; color:#38bdf8;">Book a Wash Slot</h3>
            <form action="/book" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="e.g., John Banda" required>
                </div>
                <div class="form-group">
                    <label>Phone Number (WhatsApp)</label>
                    <input type="tel" name="phone" placeholder="e.g., 0999123456" required>
                </div>
                <div class="form-group">
                    <label>Car Model & Registration</label>
                    <input type="text" name="car_model" placeholder="e.g., Toyota Vitz (BL 1234)" required>
                </div>
                <div class="form-group">
                    <label>Select Cleaning Package</label>
                    <select name="service" required>
                        {% for s in services %}
                        <option value="{{ s.name }}|{{ s.price }}">{{ s.name }} — MK {{ "{:,}".format(s.price) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit">Confirm Slot via WhatsApp</button>
            </form>
        </div>

        <div class="pricing-list">
            <h4 style="color:#cbd5e1; margin-bottom:10px;">Our Washing Packages</h4>
            {% for s in services %}
            <div class="service-box">
                <div class="service-title">
                    <span>{{ s.name }}</span>
                    <span style="color:#22c55e;">MK {{ "{:,}".format(s.price) }}</span>
                </div>
                <div class="service-desc">{{ s.desc }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
