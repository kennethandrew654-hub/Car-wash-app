<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash Booking</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 24px 16px; }
        .container { max-width: 440px; margin: auto; }

        .header { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        h1 { font-size: 1.3rem; font-weight: 700; color: #f8fafc; }
        p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        input, select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; font-size: 0.9rem; color: #f8fafc; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }

        .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Car Wash Services</h1>
            <p>Select your package and reserve a slot</p>
        </div>

        <div class="card">
            <form action="/book" method="POST">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="John Banda" required>
                </div>
                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="0991234567" required>
                </div>
                <div class="field">
                    <label>Vehicle Model</label>
                    <input type="text" name="vehicle" placeholder="Toyota" required>
                </div>
                <div class="field">
                    <label>Service Package</label>
                    <select name="service" required>
                        {% for name, price in services.items() %}
                        <option value="{{ name }}">{{ name }} — MWK {{ "{:,}".format(price) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Date</label>
                    <input type="date" name="date" required>
                </div>
                <div class="field">
                    <label>Time</label>
                    <input type="time" name="time" required>
                </div>
                <button type="submit" class="btn-submit">Confirm Booking</button>
            </form>
        </div>
    </div>
</body>
</html>
