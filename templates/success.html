<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 32px 16px; }
        .container { max-width: 440px; margin: auto; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
        h1 { font-size: 1.3rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
        p.sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }

        .details-list { border-top: 1px solid #334155; padding-top: 14px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
        .detail-row span:last-child { color: #f8fafc; font-weight: 500; }
        
        .total-row { display: flex; justify-content: space-between; border-top: 1px dashed #334155; padding-top: 12px; margin-top: 12px; font-size: 0.95rem; font-weight: 700; color: #f8fafc; }
        .total-val { color: #38bdf8; }

        .btn-link { display: block; width: 100%; text-align: center; padding: 12px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.85rem; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Booking Confirmed ✓</h1>
            <p class="sub">Thank you {{ name }}, your reservation is saved.</p>

            <div class="details-list">
                <div class="detail-row"><span>Customer</span> <span>{{ name }}</span></div>
                <div class="detail-row"><span>Phone</span> <span>{{ phone }}</span></div>
                <div class="detail-row"><span>Vehicle</span> <span>{{ vehicle }}</span></div>
                <div class="detail-row"><span>Service</span> <span>{{ service }}</span></div>
                <div class="detail-row"><span>Schedule</span> <span>{{ date }} @ {{ time }}</span></div>
                <div class="total-row">
                    <span>Total Amount</span>
                    <span class="total-val">MWK {{ "{:,}".format(price) }}</span>
                </div>
            </div>

            <a href="/" class="btn-link">Return to Home</a>
        </div>
    </div>
</body>
</html>
